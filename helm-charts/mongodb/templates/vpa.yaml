apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mongodb-vpa
  namespace: three-tier
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: mongodb-service
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: mongodb
        minAllowed:
          cpu: 200m
          memory: 256Mi
        maxAllowed:
          cpu: 1000m
          memory: 1Gi
        controlledResources:
          - cpu
          - memory
