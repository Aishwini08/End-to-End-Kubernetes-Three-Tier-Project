apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-arbiter
  namespace: three-tier
spec:
  serviceName: mongodb-arbiter
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-arbiter
  template:
    metadata:
      labels:
        app: mongodb-arbiter
    spec:
      containers:
        - name: mongodb-arbiter
          image: mongo:6.0
          args:
            - "--replSet"
            - "rs0"
            - "--bind_ip_all"
            - "--port"
            - "27017"
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-arbiter
  namespace: three-tier
spec:
  clusterIP: None
  selector:
    app: mongodb-arbiter
  ports:
    - port: 27017
